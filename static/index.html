<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h3>AI Assistant Engine</h3>
        </header>
        <div class="chat-box" id="chatBox">
            <div class="message assistant">Hello! I am ready. How can I help you today?</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type your prompt here..." autocomplete="off">
            <button id="sendBtn">Send</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
